name: Build NinjaBypass

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          brew install ldid xz

      - name: Install iOS SDK
        run: |
          set -e
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/sdks.tar.gz
          mkdir -p "$THEOS/sdks"
          tar -xzf /tmp/sdks.tar.gz -C /tmp
          if [ -d /tmp/sdks-master/iPhoneOS16.5.sdk ]; then
            SDK_DIR=/tmp/sdks-master/iPhoneOS16.5.sdk
          else
            # Pick the numerically highest iPhoneOS SDK present (no GNU sort on macOS)
            SDK_DIR=""
            bmajor=0; bminor=0
            for d in /tmp/sdks-master/iPhoneOS[0-9]*.sdk; do
              [ -d "$d" ] || continue
              v=${d##*/iPhoneOS}; v=${v%.sdk}
              major=${v%%.*}; minor=${v##*.}
              if [ "$major" -gt "$bmajor" ] || { [ "$major" -eq "$bmajor" ] && [ "$minor" -gt "$bminor" ]; }; then
                SDK_DIR=$d; bmajor=$major; bminor=$minor
              fi
            done
            if [ -z "$SDK_DIR" ]; then
              echo "No iPhoneOS SDK found in the theos/sdks archive" >&2
              ls /tmp/sdks-master >&2
              exit 1
            fi
            echo "iPhoneOS16.5.sdk not in archive; using $SDK_DIR instead"
          fi
          mv "$SDK_DIR" "$THEOS/sdks/"
          ls -la "$THEOS/sdks"

      - name: Build
        run: |
          make clean || true
          make package FINALPACKAGE=1

      - name: Collect artifacts
        run: |
          mkdir -p out
          if [ -d .theos ]; then
            find .theos -name "*.dylib" -exec cp {} out/ \;
          fi
          find . -maxdepth 3 -name "*.deb" -not -path "./out/*" -not -path "./.git/*" -exec cp {} out/ \;
          ls -la out

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: NinjaBypass-dylib
          path: out/
          if-no-files-found: error
