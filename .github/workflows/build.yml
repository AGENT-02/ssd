name: Build NinjaBypass
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -e
          export THEOS=$HOME/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          brew install ldid xz

      - name: SDK
        run: |
          set -e
          curl -fL https://github.com/theos/sdks/archive/refs/heads/master.tar.gz -o /tmp/s.tgz
          tar -xzf /tmp/s.tgz -C /tmp
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/sdks-master/iPhoneOS*.sdk "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build
        run: |
          set -e
          make clean || true
          make

      - name: Sign and collect
        run: |
          set -e
          mkdir -p out
          DYLIB=$(find .theos -name '*.dylib' | head -n1)
          [ -n "$DYLIB" ] || { echo "no dylib produced"; exit 1; }
          cp "$DYLIB" out/libNinjaBypass.dylib
          ldid -S out/libNinjaBypass.dylib
          lipo -info out/libNinjaBypass.dylib
          otool -L out/libNinjaBypass.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: libNinjaBypass
          path: out/
